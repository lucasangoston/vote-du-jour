name: Publication des décisions

on:
  schedule:
    # Toutes les heures. Le jeu de données des scrutins est régénéré une fois
    # par jour vers 12h30 (Paris) ; les autres exécutions s'arrêtent sur un 304.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Retraiter le jeu de données même s'il n'a pas changé"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Résumés compris : au plus 15 appels au modèle par passage (#9), plus 5
    # pour les arguments (#35) et une archive des comptes rendus de ~59 Mo.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - name: Job (publication sur R2)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Résumés par Claude Haiku (#9). Sans clé, le job publie sans
          # nouveau résumé, sans échouer. Le passage en direct (live.yml)
          # n'en rédige pas : il applique ceux du cache.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Notifications push des votes importants (#34) : clé JSON du
          # compte de service Firebase. Sans secret, aucune notification.
          # Le passage en direct (live.yml) n'en envoie jamais : seules les
          # décisions confirmées sont notifiées.
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: dart run bin/vote_job.dart --store=r2 ${{ inputs.force && '--force' || '' }}
      - name: Vérification de la lecture publique
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          curl -fsS "$R2_PUBLIC_BASE_URL/v1/latest.json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("schemaVersion", d["schemaVersion"], "-", len(d["decisions"]), "décisions, générées le", d["generatedAt"], "-", len(d.get("upcoming") or []), "points à venir")'
