name: votedujour
description: "Les décisions de l'Assemblée nationale, en bref."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  home_widget: ^0.10.0
  http: ^1.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  vote_contract:
    path: ../packages/vote_contract

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Logos des groupes parlementaires (#33) ; source et licence de chaque
  # fichier dans assets/group_logos/SOURCES.md.
  assets:
    - assets/group_logos/

  # Polices de la charte (#29, DESIGN.md), embarquées : Geist (chiffres
  # tabulaires pour les décomptes), licence SIL Open Font License
  # (assets/fonts/OFL.txt). Newsreader (#76), police
  # variable (graisse, taille optique) des titres, même licence
  # (assets/fonts/Newsreader-OFL.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
