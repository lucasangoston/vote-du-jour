name: Publication des décisions

on:
  schedule:
    # Toutes les heures. Le jeu de données des scrutins est régénéré une fois
    # par jour vers 12h30 (Paris) ; les autres exécutions s'arrêtent sur un 304.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Retraiter le jeu de données même s'il n'a pas changé"
        type: boolean
        default: false

permissions:
  contents: read
  # Issue « sièges manquants ».
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Résumés compris : au plus 15 appels au modèle par passage (#9), plus 5
    # pour les arguments (#35) et une archive des comptes rendus de ~59 Mo.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.13.5
      - run: dart pub get
      - name: Job (publication sur R2)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Résumés par Claude Haiku (#9). Sans clé, le job publie sans
          # nouveau résumé, sans échouer. Le passage en direct (live.yml)
          # n'en rédige pas : il applique ceux du cache.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Notifications push des votes importants (#34) : clé JSON du
          # compte de service Firebase. Sans secret, aucune notification.
          # Le passage en direct (live.yml) n'en envoie jamais : seules les
          # décisions confirmées sont notifiées.
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: dart run bin/vote_job.dart --store=r2 --seats-report="$RUNNER_TEMP/seats.md" ${{ inputs.force && '--force' || '' }}
      # Une seule issue par incident, au lieu d'un passage en échec toutes
      # les heures : la publication a réussi, seuls des sièges manquent.
      - name: Signalement des sièges manquants
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s "$RUNNER_TEMP/seats.md" ] || { echo "aucun siège manquant"; exit 0; }
          gh label create sieges --color D93F0B \
            --description "Décisions publiées sans sièges" 2>/dev/null || true
          printf '\n\nExécution : %s\n' "$RUN_URL" >> "$RUNNER_TEMP/seats.md"
          open=$(gh issue list --label sieges --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --title "Décisions publiées sans sièges" \
              --label sieges --body-file "$RUNNER_TEMP/seats.md"
          else
            # Déjà signalé : un commentaire seulement si la liste a changé.
            ids=$(head -n 1 "$RUNNER_TEMP/seats.md")
            if gh issue view "$open" --json body,comments \
              --jq '[.body, .comments[].body] | join("\n")' | grep -qF -- "$ids"; then
              echo "déjà signalé dans l'issue #$open"
            else
              gh issue comment "$open" --body-file "$RUNNER_TEMP/seats.md"
            fi
          fi
      - name: Vérification de la lecture publique
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          curl -fsS "$R2_PUBLIC_BASE_URL/v1/latest.json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("schemaVersion", d["schemaVersion"], "-", len(d["decisions"]), "décisions, générées le", d["generatedAt"], "-", len(d.get("upcoming") or []), "points à venir")'
